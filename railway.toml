[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node_modules/.bin/next start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "crm-assurance-web"

[[services]]
name = "crm-assurance-cron"
# Jobs quotidiens (omni + échéances, toutes les 24h) + recap hebdo posté le
# VENDREDI 16h Europe/Paris (DST géré via Intl, garde anti-doublon `last` sur le jour).
startCommand = "node -e \"const h=require('https');function call(p){const host=process.env.APP_URL?.replace('https://','');h.request({host,path:p,method:'POST',headers:{'authorization':'Bearer '+process.env.CRON_SECRET,'x-cron-secret':process.env.CRON_SECRET,'content-length':0}},r=>console.log(new Date().toISOString(),p,r.statusCode)).end()}function daily(){call('/api/sync/omni');call('/api/cron/echeances')}function relances(){call('/api/cron/devis6-relances')}function pilote(){call('/api/cron/pilote-identification')}function P(){const o={};for(const x of new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date()))o[x.type]=x.value;return o}let last='';function recap(){const o=P();const day=o.year+'-'+o.month+'-'+o.day;if(o.weekday==='Fri'&&+o.hour===16&&last!==day){last=day;call('/api/cron/weekly-recap')}}function questions(){call('/api/cron/devis6-questions')}daily();recap();questions();relances();pilote();setInterval(daily,24*60*60*1000);setInterval(recap,60*60*1000);setInterval(questions,5*60*1000);setInterval(relances,60*60*1000);setInterval(pilote,60*1000)\""
