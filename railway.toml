[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node_modules/.bin/next start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "crm-assurance-web"

[[services]]
name = "crm-assurance-cron"
startCommand = "node -e \"const h=require('https');function call(path){const host=process.env.APP_URL?.replace('https://','');h.request({host,path,method:'POST',headers:{'authorization':'Bearer '+process.env.CRON_SECRET,'x-cron-secret':process.env.CRON_SECRET,'content-length':0}},r=>{console.log(new Date().toISOString(),path,r.statusCode)}).end()}function run(){call('/api/sync/omni');call('/api/cron/echeances');call('/api/cron/autofill')}run();setInterval(run,24*60*60*1000)\""
